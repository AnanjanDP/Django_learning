{% extends "blog/base.html" %}

{% block title %}All Posts{% endblock %}

{% block content %}
<h2 class="mb-4">Blog Posts</h2>
<div class="list-group">
    {% for post in object_list %}
        <div class="list-group-item list-group-item-action mb-3 shadow-sm rounded">
            <h4><a href="{% url 'post_detail' post.pk %}" class="text-decoration-none">{{ post.title }}</a></h4>
            <p class="text-muted">{{ post.body|truncatewords:20 }}</p>
            <div class="d-flex justify-content-end gap-2">
                <a href="{% url 'post_update' post.pk %}" class="btn btn-sm btn-outline-secondary">Edit</a>
                <a href="{% url 'post_delete' post.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
            </div>
        </div>
    {% empty %}
        <p>No posts available yet.</p>
    {% endfor %}
</div>
{% endblock %}
