<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student List</title>
</head>

<body>
    <h1>All Student Data</h1>
    <a href="{% url 'student_create' %}">Add New Student</a>
    <ul>
        {% for s in students %}
        <li>
            <a href="{% url 'student_details' s.id %}">{{ s.name }}</a> -
            <a href="{% url 'student_edit' s.id %}">Edit</a>
            <a href="{% url 'student_delete' s.id %}">Delete</a>

        </li>
        {% endfor %}
    </ul>
</body>

</html>
