<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Search and Filter</title>
</head>
<body>
    <h1>Search and Filter Posts</h1>

    <form method="get" class="search-form">
        <!-- Search Input -->
        <input type="text" name="q" placeholder="Search..." value="{{ query }}">

        <!-- Category Dropdown Filter -->
<select name="category">
    <option value="">All Categories</option>
    <option value="tech" {% if category == 'tech' %}selected{% endif %}>tech</option>
    <option value="news" {% if category == 'news' %}selected{% endif %}>news</option>
    <option value="tutorial" {% if category == 'tutorial' %}selected{% endif %}>tutorial</option>
</select>

        <button type="submit">Search</button>
    </form>

    <hr>

    <!-- Post List Display -->
    <ul>
        {% for post in posts %}
            <li>
                <h2>{{ post.title }}</h2>
                <p>{{ post.content }}</p>
                <p><strong>Category:</strong> {{ post.category }}</p>
            </li>
        {% empty %}
            <p>No posts found.</p>
        {% endfor %}
    </ul>
</body>
</html>
