{% extends 'accounts/base.html' %}

{% block content %}
<h2>Upload Profile Picture</h2>
<!-- enctype="multipart/form-data" is mandatory for file uploads -->
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Upload</button>
</form>
{% endblock %}
